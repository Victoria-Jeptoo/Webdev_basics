<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tables</title>
  <style>
    body{
      font-family: Arial, Helvetica;
    }
    table{
      width: 75%;
      border: 3px solid black;
      margin: auto;
       border-collapse: collapse; /*merge borders*/
    }
    th{
      color:blue;
      border: 2px solid black;
      padding: 12px 8px;
      text-align:left;
      background-color: aqua;
    }
    td{
      border: 2px solid black;
      padding: 12px 8px;
      color: #810728db;
      text-align:left;
    }
    .Salary{
      color:green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <table>
    <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>City</th>
        <th>Age</th>
        <th>Salary</th>
      </tr>
    </thead>
    <tbody>
      <tr>
      <td>Jane</td>
      <td>Mwangi</td>
      <td>Nairobi</td>
      <td>21</td>
      <td class="Salary">60000</td>
      </tr>
      <tr>
        <td>John</td>
       <td>Muigai</td>
       <td>Mombasa</td>
      <td>25</td>
      <td class="Salary">65000</td>
      </tr>
      <tr>
        <td>Jane</td>
      <td>Mwangi</td>
      <td>Nairobi</td>
      <td>21</td>
      <td class="Salary">60000</td>
      </tr>
    </tbody>
  </table>
  <ul>
    <li>Jane Mwangi</li>
    <li>John Muigai</li>
    <li>Jane Mwangi</li>
    <li>Jane Mwangi</li>
  </ul>

  <!-- ORDERED LIST -->
   <ol type="">
    <li>Amazing</li>
    <li>Loving</li>
    <li>Beloved</li>
    <li>Caring</li>
   </ol>
   <!-- description list -->
    <dl>
      <dt>HTML</dt>
      <dd>HyperText Markup Language</dd>
    </dl>
</body>
</html>
